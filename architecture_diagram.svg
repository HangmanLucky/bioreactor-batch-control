<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1a1428" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="#0a0714"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <rect x="10" y="10" width="1180" height="680" fill="none" stroke="#f5a8d2" stroke-width="1.5"/>

  <text x="40" y="52" fill="#faeaf3" font-size="21" font-weight="700" letter-spacing="1">BIOREACTOR ENVIRONMENTAL CONTROL UNIT</text>
  <text x="40" y="76" fill="#e0a8c8" font-size="13">Pharmaceutical Batch Processing &#8212; ISA-88 Batch Phase &amp; Control Architecture</text>
  <line x1="40" y1="96" x2="1160" y2="96" stroke="#f5a8d2" stroke-width="1"/>

  <!-- ISA-88 phase flow -->
  <text x="40" y="130" fill="#8f86a8" font-size="10" letter-spacing="1">BATCH PHASE SEQUENCE (ISA-88 STYLE)</text>
  <g font-size="10" fill="#faeaf3">
    <rect x="40" y="145" width="90" height="34" fill="none" stroke="#e91e8c" stroke-width="1.4"/>
    <text x="85" y="166" text-anchor="middle">CIP</text>
    <rect x="150" y="145" width="90" height="34" fill="none" stroke="#e91e8c" stroke-width="1.4"/>
    <text x="195" y="166" text-anchor="middle">SIP</text>
    <rect x="260" y="145" width="100" height="34" fill="none" stroke="#e91e8c" stroke-width="1.4"/>
    <text x="310" y="166" text-anchor="middle">COOLDOWN</text>
    <rect x="380" y="145" width="110" height="34" fill="none" stroke="#e91e8c" stroke-width="1.4"/>
    <text x="435" y="166" text-anchor="middle">INOCULATION</text>
    <rect x="510" y="145" width="110" height="34" fill="none" stroke="#e91e8c" stroke-width="1.4"/>
    <text x="565" y="166" text-anchor="middle">INCUBATION</text>
    <rect x="640" y="145" width="90" height="34" fill="none" stroke="#e91e8c" stroke-width="1.4"/>
    <text x="685" y="166" text-anchor="middle">HARVEST</text>
  </g>
  <g stroke="#e91e8c" stroke-width="1.2">
    <line x1="130" y1="162" x2="150" y2="162"/><polygon points="150,158 158,162 150,166" fill="#e91e8c"/>
    <line x1="240" y1="162" x2="260" y2="162"/><polygon points="260,158 268,162 260,166" fill="#e91e8c"/>
    <line x1="360" y1="162" x2="380" y2="162"/><polygon points="380,158 388,162 380,166" fill="#e91e8c"/>
    <line x1="490" y1="162" x2="510" y2="162"/><polygon points="510,158 518,162 510,166" fill="#e91e8c"/>
    <line x1="620" y1="162" x2="640" y2="162"/><polygon points="640,158 648,162 640,166" fill="#e91e8c"/>
  </g>

  <!-- Vessel -->
  <rect x="90" y="230" width="180" height="230" rx="16" fill="none" stroke="#faeaf3" stroke-width="1.6"/>
  <text x="180" y="220" fill="#e0a8c8" font-size="11" text-anchor="middle">BIOREACTOR VESSEL</text>
  <line x1="180" y1="250" x2="180" y2="440" stroke="#cfd8e3" stroke-width="2"/>
  <text x="180" y="480" fill="#8f86a8" font-size="9" text-anchor="middle">Jacket + agitator + probes</text>

  <!-- Cascade control -->
  <rect x="330" y="230" width="220" height="110" fill="none" stroke="#4fd1e8" stroke-width="1.6"/>
  <text x="440" y="258" fill="#a3ecf7" font-size="12" text-anchor="middle" font-weight="700">CASCADE TEMP CONTROL</text>
  <text x="440" y="276" fill="#e0a8c8" font-size="9" text-anchor="middle">Outer: vessel temp -&gt; jacket setpoint</text>
  <text x="440" y="292" fill="#e0a8c8" font-size="9" text-anchor="middle">Inner: jacket temp -&gt; heat/cool valve</text>
  <text x="440" y="312" fill="#8f86a8" font-size="8" text-anchor="middle">F0 lethality integrated during SIP</text>
  <text x="440" y="326" fill="#8f86a8" font-size="8" text-anchor="middle">(10^((T-121.1)/10) per minute)</text>

  <!-- DO split range -->
  <rect x="330" y="360" width="220" height="100" fill="none" stroke="#4fd1e8" stroke-width="1.6"/>
  <text x="440" y="386" fill="#a3ecf7" font-size="12" text-anchor="middle" font-weight="700">DO SPLIT-RANGE CONTROL</text>
  <text x="440" y="404" fill="#e0a8c8" font-size="9" text-anchor="middle">0-70% output -&gt; agitator speed</text>
  <text x="440" y="420" fill="#e0a8c8" font-size="9" text-anchor="middle">70-100% output -&gt; O2 sparge valve</text>
  <text x="440" y="440" fill="#8f86a8" font-size="8" text-anchor="middle">Agitation exhausted before sparging</text>

  <line x1="270" y1="300" x2="330" y2="285" stroke="#4fd1e8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="270" y1="380" x2="330" y2="410" stroke="#4fd1e8" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- PLC -->
  <rect x="600" y="280" width="200" height="130" fill="none" stroke="#e91e8c" stroke-width="1.8"/>
  <text x="700" y="312" fill="#f5a8d2" font-size="13" text-anchor="middle" font-weight="700">BATCH PLC</text>
  <text x="700" y="330" fill="#e0a8c8" font-size="11" text-anchor="middle">Siemens S7-1500</text>
  <text x="700" y="346" fill="#e0a8c8" font-size="11" text-anchor="middle">FB_Bioreactor_BatchControl</text>
  <text x="700" y="362" fill="#8f86a8" font-size="9" text-anchor="middle">(CODESYS-portable ST)</text>
  <text x="700" y="378" fill="#8f86a8" font-size="9" text-anchor="middle">pH deadband dosing control</text>
  <line x1="550" y1="330" x2="600" y2="330" stroke="#e91e8c" stroke-width="1.2"/>
  <line x1="550" y1="410" x2="600" y2="380" stroke="#e91e8c" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- SCADA/MES -->
  <rect x="850" y="240" width="220" height="90" fill="none" stroke="#faeaf3" stroke-width="1.4"/>
  <text x="960" y="268" fill="#faeaf3" font-size="12" text-anchor="middle" font-weight="700">SCADA / MES</text>
  <text x="960" y="286" fill="#e0a8c8" font-size="9" text-anchor="middle">Recipe management</text>
  <text x="960" y="302" fill="#8f86a8" font-size="8" text-anchor="middle">Downloads ST_BatchRecipe to the PLC</text>
  <line x1="800" y1="310" x2="850" y2="290" stroke="#faeaf3" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- HMI -->
  <rect x="850" y="360" width="220" height="90" fill="none" stroke="#faeaf3" stroke-width="1.4"/>
  <text x="960" y="388" fill="#faeaf3" font-size="12" text-anchor="middle" font-weight="700">BATCH HMI</text>
  <text x="960" y="406" fill="#e0a8c8" font-size="9" text-anchor="middle">Vessel view + pH/DO trends</text>
  <text x="960" y="422" fill="#8f86a8" font-size="8" text-anchor="middle">Batch phase progress</text>
  <line x1="800" y1="380" x2="850" y2="400" stroke="#faeaf3" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Title block -->
  <rect x="880" y="600" width="290" height="70" fill="none" stroke="#f5a8d2" stroke-width="1"/>
  <text x="895" y="618" fill="#faeaf3" font-size="10">DWG NO: BIOREACTOR-ARCH-001</text>
  <text x="895" y="633" fill="#faeaf3" font-size="10">REV: A &#8212; SIMULATION / PORTFOLIO BUILD</text>
  <text x="895" y="648" fill="#faeaf3" font-size="10">AUTHOR: SIPHO LUCKY SIBANDA</text>
  <text x="895" y="663" fill="#e0a8c8" font-size="9">NOT FOR GMP PRODUCTION USE</text>
</svg>
